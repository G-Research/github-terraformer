# Default values for repository scalar properties, mirroring the literal
# defaults historically hard-coded in the root module. The importer strips any
# repo YAML value equal to these, and Terraform fills omitted values back in from
# this same file — so slimmer YAMLs produce zero infrastructure changes.
#
# vulnerability_alerts_enabled (visibility-dependent) and archive_on_destroy (a
# Terraform-only attribute, never imported) are intentionally absent: they are
# not stripped and keep their per-repo value.
allow_merge_commit: true
allow_rebase_merge: false
allow_squash_merge: false
allow_auto_merge: false
delete_branch_on_merge: true
has_issues: false
has_projects: false
has_wiki: false
is_template: false
archived: false
auto_init: true
homepage_url: ""
gitignore_template: ""
license_template: ""
description: ""
visibility: private
default_branch: ""
allow_update_branch: false
has_discussions: false
web_commit_signoff_required: false
squash_merge_commit_title: COMMIT_OR_PR_TITLE
squash_merge_commit_message: COMMIT_MESSAGES
merge_commit_title: MERGE_MESSAGE
merge_commit_message: PR_TITLE
